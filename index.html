<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Công cụ kiểm tra ngày tháng năm hợp lệ (Date Validator) - Kiểm tra năm nhuận và số ngày trong tháng chính xác.">
  <title>Date Validator - Kiểm Tra Ngày Tháng Năm Hợp Lệ</title>
</head>
<body>
  <div class="background-decor">
    <div class="glow-sphere sphere-1"></div>
    <div class="glow-sphere sphere-2"></div>
    <div class="glow-sphere sphere-3"></div>
  </div>

  <main class="container">
    <header class="app-header">
      <div class="logo-badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
          <line x1="16" x2="16" y1="2" y2="6"/>
          <line x1="8" x2="8" y1="2" y2="6"/>
          <line x1="3" x2="21" y1="10" y2="10"/>
          <path d="m9 16 2 2 4-4"/>
        </svg>
        <span>Date Checker Pro</span>
      </div>
      <h1>Kiểm Tra Ngày Hợp Lệ</h1>
      <p class="subtitle">Nhập Ngày, Tháng, Năm để xác thực tính hợp lệ và kiểm tra năm nhuận</p>
    </header>

    <div class="card glass-card">
      <form id="date-form" novalidate>
        <div class="input-grid">
          <div class="input-group">
            <label for="day">Ngày (1 - 31)</label>
            <div class="input-wrapper">
              <input type="number" id="day" name="day" placeholder="DD" min="1" max="31" required autocomplete="off">
              <span class="field-icon">📅</span>
            </div>
            <span class="error-text" id="day-error"></span>
          </div>

          <div class="input-group">
            <label for="month">Tháng (1 - 12)</label>
            <div class="input-wrapper">
              <input type="number" id="month" name="month" placeholder="MM" min="1" max="12" required autocomplete="off">
              <span class="field-icon">🗓️</span>
            </div>
            <span class="error-text" id="month-error"></span>
          </div>

          <div class="input-group">
            <label for="year">Năm (1 - 9999)</label>
            <div class="input-wrapper">
              <input type="number" id="year" name="year" placeholder="YYYY" min="1" max="9999" required autocomplete="off">
              <span class="field-icon">⏳</span>
            </div>
            <span class="error-text" id="year-error"></span>
          </div>
        </div>

        <div class="button-group">
          <button type="submit" id="btn-check" class="btn btn-primary">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
              <polyline points="22 4 12 14.01 9 11.01"/>
            </svg>
            Kiểm Tra Ngày
          </button>
          <button type="button" id="btn-reset" class="btn btn-secondary">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
            Đặt Lại
          </button>
        </div>
      </form>

      <div class="presets-section">
        <span class="presets-label">Mẫu thử nhanh:</span>
        <div class="presets-list">
          <button type="button" class="preset-chip" id="preset-leap" data-day="29" data-month="2" data-year="2024">
            ✨ 29/02/2024 (Năm nhuận)
          </button>
          <button type="button" class="preset-chip" id="preset-non-leap" data-day="29" data-month="2" data-year="2023">
            ❌ 29/02/2023 (Không nhuận)
          </button>
          <button type="button" class="preset-chip" id="preset-invalid-month" data-day="31" data-month="4" data-year="2023">
            ⚠️ 31/04/2023 (Tháng 4 có 30 ngày)
          </button>
          <button type="button" class="preset-chip" id="preset-valid-std" data-day="15" data-month="8" data-year="2025">
            ✅ 15/08/2025 (Hợp lệ)
          </button>
        </div>
      </div>

      <div id="result-box" class="result-box hidden" aria-live="polite">
        <div class="result-header">
          <span id="result-status-badge" class="badge"></span>
          <span id="result-date-display" class="date-display"></span>
        </div>
        <p id="result-message" class="result-message"></p>
        <div class="result-details" id="result-details">
          <div class="detail-item">
            <span class="detail-label">Năm nhuận:</span>
            <span class="detail-value" id="detail-leap"></span>
          </div>
          <div class="detail-item">
            <span class="detail-label">Số ngày tối đa tháng này:</span>
            <span class="detail-value" id="detail-max-days"></span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
